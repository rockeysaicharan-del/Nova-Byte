<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⁂𝙉𝙤𝙫𝙖𝘽𝙮𝙩𝖾⁂ - Multi-Language IDE</title>
    
    <!-- CodeMirror Editor Styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <!-- CodeMirror Lint CSS (Real-time Error Highlighting) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: #111827;
            border-bottom: 1px solid #1f293d;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-logo-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #0b0f19;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.4);
            font-family: 'Fira Code', monospace;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .star-icon {
            color: #38bdf8;
            -webkit-text-fill-color: initial;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select {
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #1f2937;
            color: #f3f4f6;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover, select:focus {
            border-color: #38bdf8;
            background-color: #374151;
        }

        .run-btn {
            padding: 9px 20px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .run-btn:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .run-btn:active {
            transform: scale(0.97);
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            background-color: #0b0f19;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1f293d;
            min-width: 0;
        }

        .pane:last-child {
            border-right: none;
        }

        .pane-header {
            background-color: #111827;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #9ca3af;
            border-bottom: 1px solid #1f293d;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .CodeMirror {
            flex: 1;
            height: auto !important;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            background-color: #0d1322 !important;
        }

        .cm-s-dracula.CodeMirror {
            background-color: #0d1322 !important;
        }

        /* Error Marker Highlight */
        .CodeMirror-lint-mark-error {
            border-bottom: 2px dashed #ef4444;
            background-color: rgba(239, 68, 68, 0.15);
        }

        #output-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #050811;
        }

        #output {
            flex: 1;
            color: #38bdf8;
            padding: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            white-space: pre-wrap;
            border: none;
            margin: 0;
        }

        #html-preview {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
            display: none;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .workspace {
                flex-direction: column;
                height: auto;
            }
            .pane {
                height: 450px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .controls {
                justify-content: space-between;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="logo-container">
            <div class="app-logo-badge">&lt;/&gt;</div>
            <div class="brand-title">
                <span class="star-icon">✯</span>NovaByte<span class="star-icon">✯</span>
            </div>
        </div>
        <div class="controls">
            <select id="language-select">
                <option value="javascript">JavaScript</option>
                <option value="html">HTML / CSS</option>
                <option value="python">Python</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
                <option value="java">Java</option>
                <option value="csharp">C#</option>
                <option value="go">Go</option>
            </select>
            <button class="run-btn" id="run-btn">▶ Run Code</button>
        </div>
    </header>

    <!-- Workspace View -->
    <div class="workspace">
        <div class="pane">
            <div class="pane-header">
                <span>Source Code</span>
                <span id="lang-indicator" style="color: #38bdf8;">JavaScript</span>
            </div>
            <textarea id="editor-textarea">console.log("Welcome to NovaByte IDE!");
let a = 10;
let b = 20;
console.log("Sum:", a + b);</textarea>
        </div>
        
        <div class="pane">
            <div class="pane-header">
                <span id="output-title">Console Output</span>
            </div>
            <div id="output-container">
                <pre id="output">Click "Run Code" to execute...</pre>
                <iframe id="html-preview"></iframe>
            </div>
        </div>
    </div>

    <!-- CodeMirror Editor Core Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>

    <!-- JSHint & CodeMirror Lint Addons for Real-Time Error Checking -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/javascript-lint.min.js"></script>

    <script>
        const codeTemplates = {
            javascript: `console.log("Welcome to NovaByte!");\nlet x = 5;\nlet y = 15;\nconsole.log("Result:", x * y);`,
            html: `<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: Arial; text-align: center; padding-top: 40px; background: #0f172a; color: white; }\n    h1 { color: #38bdf8; }\n    button { padding: 10px 20px; background: #10b981; border: none; color: white; border-radius: 5px; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <h1>Hello NovaByte Live Preview!</h1>\n  <p>Edit this HTML/CSS code and hit Run Code.</p>\n  <button onclick="alert('NovaByte Engine Working!')">Click Me</button>\n</body>\n</html>`,
            python: `print("Hello from Python on NovaByte!")\nnumbers = [1, 2, 3, 4, 5]\nprint("Sum of list:", sum(numbers))`,
            cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from C++ on NovaByte!" << endl;\n    return 0;\n}`,
            c: `#include <stdio.h>\n\nint main() {\n    printf("Hello from C on NovaByte!\\n");\n    return 0;\n}`,
            java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from Java on NovaByte!");\n    }\n}`,
            csharp: `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from C# on NovaByte!");\n    }\n}`,
            go: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello from Go on NovaByte!")\n}`
        };

        // Initialize CodeMirror Component with Linting
        var editor = CodeMirror.fromTextArea(document.getElementById("editor-textarea"), {
            lineNumbers: true,
            theme: "dracula",
            mode: "javascript",
            indentUnit: 4,
            gutters: ["CodeMirror-lint-markers"],
            lint: true
        });

        const langSelect = document.getElementById("language-select");
        const langIndicator = document.getElementById("lang-indicator");
        const outputScreen = document.getElementById("output");
        const htmlPreview = document.getElementById("html-preview");
        const outputTitle = document.getElementById("output-title");

        // Handle Language Switch Events
        langSelect.addEventListener("change", function() {
            let lang = this.value;
            langIndicator.textContent = langSelect.options[langSelect.selectedIndex].text;
            
            // Set Syntax Highlighting & Linting Mode
            if (lang === "javascript") {
                editor.setOption("mode", "javascript");
                editor.setOption("lint", true);
            } else {
                editor.setOption("lint", false);
                if (lang === "html") editor.setOption("mode", "htmlmixed");
                else if (lang === "python") editor.setOption("mode", "python");
                else if (lang === "cpp" || lang === "c") editor.setOption("mode", "text/x-c++src");
                else if (lang === "java") editor.setOption("mode", "text/x-java");
                else if (lang === "csharp") editor.setOption("mode", "text/x-csharp");
                else if (lang === "go") editor.setOption("mode", "go");
            }

            editor.setValue(codeTemplates[lang] || "");

            if (lang === "html") {
                outputTitle.textContent = "Live Web Preview";
            } else {
                outputTitle.textContent = "Console Output";
                htmlPreview.style.display = "none";
                outputScreen.style.display = "block";
            }
        });

        // Run Code Handler
        document.getElementById("run-btn").addEventListener("click", async function() {
            let code = editor.getValue();
            let language = langSelect.value;
            
            if (language === "html") {
                outputScreen.style.display = "none";
                htmlPreview.style.display = "block";
                let iframeDoc = htmlPreview.contentDocument || htmlPreview.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(code);
                iframeDoc.close();
                return;
            }

            htmlPreview.style.display = "none";
            outputScreen.style.display = "block";
            outputScreen.textContent = "Running engine...";

            if (language === "javascript") {
                outputScreen.textContent = "";
                let logs = [];
                let originalConsoleLog = console.log;
                
                console.log = function(...args) {
                    logs.push(args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' '));
                    originalConsoleLog.apply(console, args);
                };

                try {
                    let result = eval(code);
                    if (logs.length > 0) {
                        outputScreen.textContent = logs.join('\n');
                    } else if (result !== undefined) {
                        outputScreen.textContent = result;
                    } else {
                        outputScreen.textContent = "Code executed successfully.";
                    }
                } catch (error) {
                    outputScreen.textContent = "Execution Error: " + error.message;
                } finally {
                    console.log = originalConsoleLog;
                }
                return;
            }

            try {
                let engineLang = language;
                if (language === "cpp") engineLang = "c++";

                let response = await fetch("https://emkc.org/api/v2/piston/execute", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language: engineLang,
                        version: "*",
                        files: [{ content: code }]
                    })
                });

                let result = await response.json();
                if (result.run) {
                    outputScreen.textContent = result.run.output || result.run.stderr || "Executed with no console output.";
                } else {
                    outputScreen.textContent = "Compilation/Execution failed.";
                }
            } catch (error) {
                outputScreen.textContent = "Engine Error: Could not connect to runner service.";
            }
        });
    </script>
</body>
</html>
