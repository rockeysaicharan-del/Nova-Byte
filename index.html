<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSphere - Offline JS Compiler</title>
    
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #059669;
            background-color: #10b981;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #059669;
        }

        /* Workspace */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }

        .pane:last-child {
            border-right: none;
        }

        .pane-header {
            background-color: #1e293b;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
        }

        .CodeMirror {
            flex: 1;
            height: auto !important;
            font-size: 14px;
        }

        #output {
            flex: 1;
            background-color: #090d16;
            color: #38bdf8;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .workspace {
                flex-direction: column;
                height: auto;
            }
            .pane {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <!-- Logo embedded directly as Base64 -->
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEAAQMAAABmvDolAAAAA1BMVEUAAACnej3aAAAASElEQVRo3u3BMQEAAADCoPVPbQ0PoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIC3AAGbAAHa4b3LAAAAAElFTkSuQmCC" alt="CodeFlow Logo" class="app-logo" id="embedded-logo">
            <h1>CodeSphere</h1>
        </div>
        <div class="controls">
            <button id="run-btn">▶ Run JavaScript</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Editor -->
        <div class="pane">
            <div class="pane-header">JavaScript Source Code</div>
            <textarea id="editor-textarea">console.log("Hello CodeSphere!");
let a = 10;
let b = 20;
console.log("Sum:", a + b);</textarea>
        </div>
        
        <!-- Output -->
        <div class="pane">
            <div class="pane-header">Output (Browser Console Capture)</div>
            <pre id="output">Click "Run JavaScript" to see output...</pre>
        </div>
    </div>

    <!-- CodeMirror Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <script>
        // Load actual image data into the embedded logo tag dynamically from the uploaded image source
        // (You can also replace the base64 string above with your full base64 data if needed)
        
        // Editor Setup
        var editor = CodeMirror.fromTextArea(document.getElementById("editor-textarea"), {
            lineNumbers: true,
            theme: "dracula",
            mode: "javascript",
            indentUnit: 4
        });

        // Run Code Locally without API
        document.getElementById("run-btn").addEventListener("click", function() {
            let code = editor.getValue();
            let outputScreen = document.getElementById("output");
            outputScreen.textContent = "";

            // Capture console.log statements
            let logs = [];
            let originalConsoleLog = console.log;
            
            console.log = function(...args) {
                logs.push(args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' '));
                originalConsoleLog.apply(console, args);
            };

            try {
                let result = eval(code);
                
                if (logs.length > 0) {
                    outputScreen.textContent = logs.join('\n');
                } else if (result !== undefined) {
                    outputScreen.textContent = result;
                } else {
                    outputScreen.textContent = "Code executed successfully (No output returned).";
                }
            } catch (error) {
                outputScreen.textContent = "Error: " + error.message;
            } finally {
                // Restore original console.log
                console.log = originalConsoleLog;
            }
        });
    </script>
</body>
</html>
