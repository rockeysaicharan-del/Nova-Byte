<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeSphere | Online Code Compiler</title>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/nord.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/onedark.min.css"/>

  <!-- CodeMirror JS & Languages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/rust/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/ruby/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/php/php.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #181825;
      color: #cdd6f4;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #11111b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #313244;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { margin: 0; font-size: 20px; color: #89b4fa; }
    .brand span { font-size: 12px; color: #a6adc8; }
    .controls { display: flex; gap: 10px; align-items: center; }
    select, button, input[type="file"] {
      background-color: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    button.run-btn {
      background-color: #a6e3a1;
      color: #11111b;
      font-weight: bold;
      border: none;
    }
    button.run-btn:hover { background-color: #94e2d5; }
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #313244;
    }
    .CodeMirror {
      flex: 1;
      height: 100%;
      font-family: "Fira Code", monospace;
      font-size: 14px;
    }
    .console-section {
      width: 40%;
      display: flex;
      flex-direction: column;
      background-color: #1e1e2e;
    }
    .console-header {
      background-color: #181825;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: bold;
      color: #a6adc8;
      border-bottom: 1px solid #313244;
      display: flex;
      justify-content: space-between;
    }
    textarea.input-box {
      width: 100%;
      height: 100px;
      background-color: #11111b;
      color: #cdd6f4;
      border: none;
      padding: 10px;
      font-family: monospace;
      resize: vertical;
      outline: none;
    }
    .output-box {
      flex: 1;
      background-color: #11111b;
      color: #a6e3a1;
      padding: 12px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-y: auto;
      margin: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>⚡ CodeSphere</h1>
      <span>Write. Compile. Explore.</span>
    </div>

    <div class="controls">
      <select id="langSelect" onchange="changeLanguage()">
        <option value="python">Python 3</option>
        <option value="cpp">C++</option>
        <option value="c">C</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
      </select>

      <select id="themeSelect" onchange="changeTheme()">
        <option value="dracula">Dracula</option>
        <option value="monokai">Monokai</option>
        <option value="nord">Nord</option>
        <option value="onedark">One Dark</option>
      </select>

      <button onclick="downloadCode()">Download</button>
      <button class="run-btn" onclick="runCode()">▶ Run (Ctrl+Enter)</button>
    </div>
  </header>

  <div class="main-container">
    <div class="editor-section">
      <textarea id="codeEditor"></textarea>
    </div>

    <div class="console-section">
      <div class="console-header">Standard Input (stdin)</div>
      <textarea id="customInput" class="input-box" placeholder="Enter custom input here..."></textarea>

      <div class="console-header">
        <span>Output</span>
        <span id="executionTime" style="font-weight: normal; font-size: 11px;"></span>
      </div>
      <pre id="output" class="output-box">Press "Run" to execute your code...</pre>
    </div>
  </div>

  <script>
    const defaultTemplates = {
      python: 'print("Welcome to CodeSphere!")\nprint("Code execution powered by Piston API.")',
      cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Welcome to CodeSphere!" << endl;\n    return 0;\n}',
      c: '#include <stdio.h>\n\nint main() {\n    printf("Welcome to CodeSphere!\\n");\n    return 0;\n}',
      javascript: 'console.log("Welcome to CodeSphere!");',
      java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Welcome to CodeSphere!");\n    }\n}',
      go: 'package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Welcome to CodeSphere!")\n}',
      rust: 'fn main() {\n    println!("Welcome to CodeSphere!");\n}'
    };

    const langModes = {
      python: "python", cpp: "text/x-c++src", c: "text/x-csrc",
      javascript: "javascript", java: "text/x-java", go: "go", rust: "rust"
    };

    const langVersions = {
      python: { language: "python", version: "3.10.0", ext: "py" },
      cpp: { language: "cpp", version: "10.2.0", ext: "cpp" },
      c: { language: "c", version: "10.2.0", ext: "c" },
      javascript: { language: "javascript", version: "18.15.0", ext: "js" },
      java: { language: "java", version: "15.0.2", ext: "java" },
      go: { language: "go", version: "1.16.2", ext: "go" },
      rust: { language: "rust", version: "1.68.2", ext: "rs" }
    };

    const editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
      lineNumbers: true,
      theme: "dracula",
      mode: "python"
    });

    editor.setValue(defaultTemplates.python);

    function changeLanguage() {
      const lang = document.getElementById("langSelect").value;
      editor.setOption("mode", langModes[lang]);
      editor.setValue(defaultTemplates[lang]);
    }

    function changeTheme() {
      const theme = document.getElementById("themeSelect").value;
      editor.setOption("theme", theme);
    }

    async function runCode() {
      const outputDiv = document.getElementById("output");
      const timeDiv = document.getElementById("executionTime");
      outputDiv.innerText = "Compiling & Executing...";
      timeDiv.innerText = "";

      const langKey = document.getElementById("langSelect").value;
      const code = editor.getValue();
      const input = document.getElementById("customInput").value;
      const langConfig = langVersions[langKey];

      const startTime = performance.now();

      try {
        const response = await fetch("https://emkc.org/api/v2/piston/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            language: langConfig.language,
            version: langConfig.version,
            files: [{ content: code }],
            stdin: input
          })
        });

        const data = await response.json();
        const endTime = performance.now();

        timeDiv.innerText = `Time: ${((endTime - startTime) / 1000).toFixed(2)}s`;

        if (data.run) {
          outputDiv.innerText = data.run.output || "Program finished with no output.";
          outputDiv.style.color = data.run.code === 0 ? "#a6e3a1" : "#f38ba8";
        } else {
          outputDiv.innerText = "Error executing code.";
          outputDiv.style.color = "#f38ba8";
        }
      } catch (err) {
        outputDiv.innerText = "Network / API Error: " + err.message;
        outputDiv.style.color = "#f38ba8";
      }
    }

    function downloadCode() {
      const langKey = document.getElementById("langSelect").value;
      const code = editor.getValue();
      const ext = langVersions[langKey].ext;
      const blob = new Blob([code], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `main.${ext}`;
      link.click();
    }

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        runCode();
      }
    });
  </script>
</body>
</html>
